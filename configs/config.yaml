project:
  name: "probabilistic-automata-time-series"
  random_seeds: [42, 123, 2026, 7, 999]
  device: "cuda"

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  split_data: "data/splits"

  results: "results"
  logs: "results/logs"
  figures: "results/figures"
  tables: "results/tables"
  explanations: "results/explanations"

datasets:

  skab:
    valve_folders:
      - "valve1"
      - "valve2"

    target_column: "anomaly"

    drop_columns:
      - "datetime"
      - "changepoint"
      - "source_group"
      - "source_file"

    group_column: "source_file"

    split:
      train: 0.6
      validation: 0.2
      test: 0.2

  batadal:
    train_file: "BATADAL_dataset04.csv"

    target_column: "ATT_FLAG"

    normal_label_value: -999
    anomaly_label_value: 1

    drop_columns:
      - "DATETIME"

    split:
      train: 0.6
      validation: 0.2
      test: 0.2

preprocessing:
  missing_data:
    enabled: true
    strategy: "mean"

  scaler: "standard"

  pca:
    enabled: true
    n_components: 1

  sequence_length: 16
  sequence_stride: 1

noise:
  enabled: true
  gaussian_mean: 0.0
  gaussian_std: 0.05

logging:
  save_logs: true
  log_level: "INFO"
