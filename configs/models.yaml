deep_learning:

  lstm:
    architecture: "lstm"
    enabled: true
    input_size: 1
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    output_size: 1
    learning_rate: 0.001

  gru:
    architecture: "gru"
    enabled: true
    input_size: 1
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    output_size: 1
    learning_rate: 0.001

  cnn:
    architecture: "cnn"
    enabled: true
    input_channels: 1
    num_filters: 64
    kernel_size: 3
    dropout: 0.2
    output_size: 1
    learning_rate: 0.001

training:

  batch_size: 32
  epochs: 50

  early_stopping:
    enabled: true
    patience: 5
    monitor: "val_loss"
    mode: "min"

  class_imbalance:
    use_pos_weight: true
    pos_weight_strategy: "neg_pos_ratio"
    loss_name: "bce"
    focal_gamma: 2.0
    dataset_overrides:
      SKAB:
        use_pos_weight: false
    dataset_model_overrides:
      - dataset: "BATADAL"
        model: "GRU"
        loss_name: "focal"
        focal_gamma: 2.0

  threshold_tuning:
    enabled: true
    metric: "f1"
    beta: 2.0
    start: 0.01
    end: 0.99
    step: 0.01
    dataset_overrides:
      BATADAL:
        metric: "f2"
      SKAB:
        metric: "f1"
        min_threshold: 0.10

  optimizer: "adam"

automata:
  anomaly_threshold: 0.1

  paa:
    window_size: 4

  sax:
    alphabet_size: 3

  sliding_window:
    size: 4
    stride: 1

  unseen_pattern:
    enabled: true
    method: "levenshtein"

  probability:
    smoothing: true
    epsilon: 0.0001

  decision:
    score_field: "average_log_probability"
    fallback_quantile: 0.05
